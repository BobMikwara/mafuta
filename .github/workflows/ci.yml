name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guardrails
        run: npm run guardrails

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit and integration tests with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fueltrack
          POSTGRES_PASSWORD: fueltrack
          POSTGRES_DB: fueltrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fueltrack -d fueltrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-shadow:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fueltrack
          POSTGRES_PASSWORD: fueltrack
          POSTGRES_DB: fueltrack_shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fueltrack -d fueltrack_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fueltrack:fueltrack@localhost:5432/fueltrack_test?schema=public
      SHADOW_DATABASE_URL: postgresql://fueltrack:fueltrack@localhost:5433/fueltrack_shadow?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Check the migrations match the schema
        run: npm run db:drift

      - name: Migration data rules
        run: npm run db:test
